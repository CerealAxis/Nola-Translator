  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

        &lt;div class=&quot;fc-diagnostic-grid&quot;&gt;
          &lt;section class=&quot;card&quot;&gt;&lt;span class=&quot;text-muted&quot;&gt;引擎&lt;/span&gt;&lt;p class=&quot;viz-stat-value&quot;&gt;已就绪&lt;/p&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;Python · x64&lt;/span&gt;&lt;/section&gt;
          &lt;section class=&quot;card&quot;&gt;&lt;span class=&quot;text-muted&quot;&gt;识别后端&lt;/span&gt;&lt;p class=&quot;viz-stat-value&quot;&gt;sherpa-onnx&lt;/p&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;CPU · 实时模式&lt;/span&gt;&lt;/section&gt;
          &lt;section class=&quot;card&quot;&gt;&lt;span class=&quot;text-muted&quot;&gt;翻译后端&lt;/span&gt;&lt;p class=&quot;viz-stat-value&quot;&gt;Argos&lt;/p&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;完全离线&lt;/span&gt;&lt;/section&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;fluentcaptions-demo&#x27;);
      const navButtons = root.querySelectorAll(&#x27;[data-page-target]&#x27;);
      const pages = root.querySelectorAll(&#x27;[data-page]&#x27;);
      const toast = root.querySelector(&#x27;.fc-toast&#x27;);
      const toastText = root.querySelector(&#x27;#fc-toast-text&#x27;);
      let toastTimer;

      function showToast(message) {
        toastText.textContent = message;
        toast.classList.add(&#x27;is-visible&#x27;);
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() =&gt; toast.classList.remove(&#x27;is-visible&#x27;), 2200);
      }

      navButtons.forEach((button) =&gt; {
        button.addEventListener(&#x27;click&#x27;, () =&gt; {
          const target = button.dataset.pageTarget;
          navButtons.forEach((item) =&gt; {
            const selected = item === button;
            item.classList.toggle(&#x27;is-selected&#x27;, selected);
            item.setAttribute(&#x27;aria-selected&#x27;, String(selected));
          });
          pages.forEach((page) =&gt; page.classList.toggle(&#x27;is-active&#x27;, page.dataset.page === target));
        });
      });

      const sessionCard = root.querySelector(&#x27;#fc-session-card&#x27;);
      const startButton = root.querySelector(&#x27;#fc-start&#x27;);
      const startLabel = startButton.querySelector(&#x27;span&#x27;);
      const sessionCopy = root.querySelector(&#x27;#fc-session-copy&#x27;);
      const overlayState = root.querySelector(&#x27;#fc-overlay-state&#x27;);
      const sourceCaption = root.querySelector(&#x27;#fc-source-caption&#x27;);
      const translationCaption = root.querySelector(&#x27;#fc-translation-caption&#x27;);
      const sourceCheck = root.querySelector(&#x27;#fc-source-check&#x27;);
      const zhCheck = root.querySelector(&#x27;#fc-zh-check&#x27;);
      let listening = false;
      let captionTimer;
      let captionIndex = 0;
      const captions = [
        [&#x27;Welcome to FluentCaptions.&#x27;, &#x27;欢迎使用 FluentCaptions。&#x27;],
        [&#x27;Your audio stays on this computer.&#x27;, &#x27;你的音频始终保留在这台电脑上。&#x27;],
        [&#x27;Live captions can be fast and private.&#x27;, &#x27;实时字幕也可以既快速又保护隐私。&#x27;],
        [&#x27;Everything happens locally on your device.&#x27;, &#x27;所有处理都在你的设备上本地完成。&#x27;]
      ];

      function renderCaption() {
        const pair = captions[captionIndex % captions.length];
        captionIndex += 1;
        sourceCaption.textContent = pair[0];
        translationCaption.textContent = pair[1];
      }

      startButton.addEventListener(&#x27;click&#x27;, () =&gt; {
        listening = !listening;
        sessionCard.classList.toggle(&#x27;is-listening&#x27;, listening);
        startButton.classList.toggle(&#x27;btn-primary&#x27;, !listening);
        startLabel.textContent = listening ? &#x27;停止字幕&#x27; : &#x27;开始字幕&#x27;;
        sessionCopy.textContent = listening ? &#x27;正在监听系统声音&#x27; : &#x27;准备就绪&#x27;;
        overlayState.textContent = listening ? &#x27;正在识别&#x27; : &#x27;演示字幕&#x27;;
        clearInterval(captionTimer);
        if (listening) {
          renderCaption();
          captionTimer = setInterval(renderCaption, 2400);
        }
      });

      sourceCheck.addEventListener(&#x27;change&#x27;, () =&gt; {
        sourceCaption.hidden = !sourceCheck.checked;
      });
      zhCheck.addEventListener(&#x27;change&#x27;, () =&gt; {
        translationCaption.hidden = !zhCheck.checked;
      });

      const overlay = root.querySelector(&#x27;#fc-overlay&#x27;);
      const overlayToggle = root.querySelector(&#x27;#fc-overlay-toggle&#x27;);
      overlayToggle.addEventListener(&#x27;click&#x27;, () =&gt; {
        const hidden = overlay.classList.toggle(&#x27;is-hidden&#x27;);
        overlayToggle.lastChild.textContent = hidden ? &#x27;显示字幕预览&#x27; : &#x27;隐藏字幕预览&#x27;;
      });

      root.querySelector(&#x27;#fc-add-language&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
        showToast(&#x27;Demo 中暂以一条译文展示，多语言布局已保留&#x27;);
      });

      const packageButton = root.querySelector(&#x27;#fc-download-package&#x27;);
      const packageLabel = packageButton.querySelector(&#x27;span&#x27;);
      const packageState = root.querySelector(&#x27;#fc-package-state&#x27;);
      const packageProgress = root.querySelector(&#x27;#fc-package-progress&#x27;);
      packageButton.addEventListener(&#x27;click&#x27;, () =&gt; {
        if (packageButton.disabled) return;
        packageButton.disabled = true;
        packageProgress.hidden = false;
        packageLabel.textContent = &#x27;下载中&#x27;;
        packageState.textContent = &#x27;正在下载&#x27;;
        let value = 0;
        const downloadTimer = setInterval(() =&gt; {
          value += 10;
          packageProgress.value = value;
          if (value &gt;= 100) {
            clearInterval(downloadTimer);
            packageLabel.textContent = &#x27;已安装&#x27;;
            packageState.innerHTML = &#x27;&lt;span class=&quot;viz-badge&quot;&gt;已安装&lt;/span&gt;&#x27;;
            packageProgress.hidden = true;
            showToast(&#x27;日语翻译语言包安装完成&#x27;);
          }
        }, 120);
      });

      const opacityRange = root.querySelector(&#x27;#fc-opacity-range&#x27;);
      const opacityValue = root.querySelector(&#x27;#fc-opacity-value&#x27;);
      const sizeRange = root.querySelector(&#x27;#fc-size-range&#x27;);
      const sizeValue = root.querySelector(&#x27;#fc-size-value&#x27;);
      const styleOverlay = root.querySelector(&#x27;#fc-style-overlay&#x27;);
      const styleSource = root.querySelector(&#x27;#fc-style-source&#x27;);
      const styleTranslation = root.querySelector(&#x27;#fc-style-translation&#x27;);

      opacityRange.addEventListener(&#x27;input&#x27;, () =&gt; {
        const value = Number(opacityRange.value);
        root.style.setProperty(&#x27;--fc-caption-opacity&#x27;, String(value / 100));
        opacityValue.textContent = value + &#x27;%&#x27;;
      });

      sizeRange.addEventListener(&#x27;input&#x27;, () =&gt; {

      root.querySelector(&#x27;#fc-original-switch&#x27;).addEventListener(&#x27;change&#x27;, (event) =&gt; {

        sizeRange.value = &#x27;28&#x27;;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }

  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }

  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);

    }

    }

    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
