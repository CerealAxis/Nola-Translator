    <g transform="translate(63 99) scale(0.063)">
      <path d="M144 48H368C421.019 48 464 90.981 464 144V304C464 357.019 421.019 400 368 400H226L143.2 462.1C136.607 467.045 127.2 462.341 127.2 454.1V398.53C82.221 390.6 48 351.344 48 304V144C48 90.981 90.981 48 144 48Z" fill="url(#brand)"/>
