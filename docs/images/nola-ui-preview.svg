<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title description">
  <title id="title">Nola Translator interface concept</title>
  <desc id="description">Nola Translator interface concept with navigation, caption settings, and bilingual subtitles.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1200" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EDF5FB"/>
      <stop offset="1" stop-color="#E4EAF5"/>
    </linearGradient>
    <linearGradient id="stage" x1="332" y1="531" x2="1100" y2="696" gradientUnits="userSpaceOnUse">
      <stop stop-color="#DCEAF7"/>
      <stop offset="1" stop-color="#F4F7FC"/>
    </linearGradient>
    <linearGradient id="brand" x1="80" y1="48" x2="430" y2="410" gradientUnits="userSpaceOnUse">
      <stop stop-color="#168BD9"/>
      <stop offset="1" stop-color="#2255C7"/>
    </linearGradient>
    <filter id="window-shadow" x="0" y="0" width="1200" height="760" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="25" flood-color="#47618A" flood-opacity="0.16"/>
    </filter>
    <filter id="caption-shadow" x="0" y="0" width="1200" height="760" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#10233B" flood-opacity="0.2"/>
    </filter>
    <clipPath id="window-clip"><rect x="40" y="86" width="1120" height="644" rx="20"/></clipPath>
  </defs>

  <rect width="1200" height="760" fill="url(#canvas)"/>
  <circle cx="1096" cy="56" r="250" fill="#B5D5F5" opacity="0.24"/>
  <circle cx="72" cy="715" r="210" fill="#B9D5F4" opacity="0.22"/>
  <text x="43" y="53" fill="#537091" font-family="Segoe UI, Microsoft YaHei UI, sans-serif" font-size="14" font-weight="700" letter-spacing="2.2">NOLA TRANSLATOR</text>
  <text x="1157" y="53" text-anchor="end" fill="#738BA5" font-family="Segoe UI, Microsoft YaHei UI, sans-serif" font-size="14">INTERFACE CONCEPT</text>

  <g filter="url(#window-shadow)"><rect x="40" y="86" width="1120" height="644" rx="20" fill="#F8FAFD" stroke="#D8E2EC"/></g>
