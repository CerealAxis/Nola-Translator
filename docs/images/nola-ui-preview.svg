    <text x="310" y="522" fill="#243B54" font-family="Segoe UI, Microsoft YaHei UI, sans-serif" font-size="19" font-weight="700">字幕预览</text>
    <text x="1121" y="522" text-anchor="end" fill="#70859D" font-family="Segoe UI, Microsoft YaHei UI, sans-serif" font-size="13">效果预览</text>
