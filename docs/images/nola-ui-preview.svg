    <text x="413" y="590" fill="#A8B3C2" font-family="Segoe UI, Microsoft YaHei UI, sans-serif" font-size="12">本地字幕 · 双语</text>
    <text x="400" y="616" fill="#F7FAFD" font-family="Segoe UI, Microsoft YaHei UI, sans-serif" font-size="18" font-weight="600">Welcome to Nola Translator.</text>
    <text x="400" y="646" fill="#AEE8DC" font-family="Segoe UI, Microsoft YaHei UI, sans-serif" font-size="18">欢迎使用诺拉翻译。</text>
