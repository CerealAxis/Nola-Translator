    <text x="350" y="418" fill="#2A435E" font-family="Segoe UI, Microsoft YaHei UI, sans-serif" font-size="14">中文、日本語</text>
    <path d="m669 409 5 5 5-5" fill="none" stroke="#7890A5" stroke-width="1.5"/>

    <text x="717" y="385" fill="#637790" font-family="Segoe UI, Microsoft YaHei UI, sans-serif" font-size="13">显示内容</text>
