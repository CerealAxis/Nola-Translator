    <circle cx="86" cy="285" r="9" fill="#DDE8F2"/><text x="110" y="291" fill="#60748C" font-family="Segoe UI, Microsoft YaHei UI, sans-serif" font-size="15">模型与资源</text>
    <circle cx="86" cy="332" r="9" fill="#DDE8F2"/><text x="110" y="338" fill="#60748C" font-family="Segoe UI, Microsoft YaHei UI, sans-serif" font-size="15">翻译</text>
    <circle cx="86" cy="379" r="9" fill="#DDE8F2"/><text x="110" y="385" fill="#60748C" font-family="Segoe UI, Microsoft YaHei UI, sans-serif" font-size="15">外观</text>
    <circle cx="86" cy="426" r="9" fill="#DDE8F2"/><text x="110" y="432" fill="#60748C" font-family="Segoe UI, Microsoft YaHei UI, sans-serif" font-size="15">历史记录</text>
    <circle cx="86" cy="473" r="9" fill="#DDE8F2"/><text x="110" y="479" fill="#60748C" font-family="Segoe UI, Microsoft YaHei UI, sans-serif" font-size="15">诊断</text>
    <path d="M56 661H252" stroke="#DDE6EF"/>
    <circle cx="84" cy="690" r="5" fill="#38A980"/>
