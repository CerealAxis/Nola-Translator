name: Build application
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - name: Set development version
        shell: pwsh
        env:
          BUILD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version.Split('-')[0].Split('+')[0]
          if ($env:BUILD_COMMIT -notmatch '^[0-9a-fA-F]{40}$') { throw 'Expected a full Git commit SHA' }
          $shaSuffix = $env:BUILD_COMMIT.Substring($env:BUILD_COMMIT.Length - 5).ToLowerInvariant()
          npm version "$version-dev.$shaSuffix" --no-git-tag-version --ignore-scripts
          if ($LASTEXITCODE -ne 0) { throw 'Setting development version failed' }
      - id: package
        uses: ./.github/actions/build-windows
      - name: Upload downloads
        uses: ./.github/actions/upload-distributions
        with:
          exe-x64: ${{ steps.package.outputs.exe-x64 }}
          msi-x64: ${{ steps.package.outputs.msi-x64 }}
          source: ${{ steps.package.outputs.source }}
          retention-days: 14
