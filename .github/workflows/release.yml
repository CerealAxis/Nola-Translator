name: Release application
on:
  push:
    tags: ['v*']
  release:
    types: [published]
permissions:
  contents: write
concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || github.ref_name }}
      - name: Set release version from tag
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$') { throw 'Release tag must be vMAJOR.MINOR.PATCH, optionally with prerelease/build suffixes' }
          npm version $env:RELEASE_TAG.Substring(1) --no-git-tag-version --ignore-scripts --allow-same-version
          if ($LASTEXITCODE -ne 0) { throw 'Setting release version failed' }
      - id: package
        uses: ./.github/actions/build-windows
      - name: Upload downloads
        uses: ./.github/actions/upload-distributions
        with:
          exe-x64: ${{ steps.package.outputs.exe-x64 }}
          msi-x64: ${{ steps.package.outputs.msi-x64 }}
          exe-arm64: ${{ steps.package.outputs.exe-arm64 }}
          msi-arm64: ${{ steps.package.outputs.msi-arm64 }}
          source: ${{ steps.package.outputs.source }}
          retention-days: 30
      - name: Publish release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -ne 0) {
            $options = @('--generate-notes', '--verify-tag')
            if ($env:RELEASE_TAG.Substring(1).Split('+')[0].Contains('-')) { $options += '--prerelease' }
            gh release create $env:RELEASE_TAG @options
            if ($LASTEXITCODE -ne 0) { throw 'Creating release failed' }
          }
          $assets = @(Get-ChildItem -LiteralPath release -File | Where-Object { $_.Name -like '*-Setup.exe' -or $_.Name -like '*-Setup.msi' -or $_.Name -like '*-Source.zip' } | ForEach-Object FullName)
          gh release upload $env:RELEASE_TAG @assets --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Uploading release assets failed' }
