name: "🐛 Bug 报告（中文）"
description: "报告 Nola Translator 中可复现的问题。"
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        感谢你帮助改进 Nola Translator。提交前请完成下方排查确认。你可以先查看[帮助文档](https://nola.xaviermc.top)。
  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前排查清单
      description: 提交 Bug 前，请确认以下各项。
      options:
        - label: 我已搜索现有 Issues，确认没有相同问题。
          required: true
        - label: 我已查阅帮助文档：https://nola.xaviermc.top。
          required: true
        - label: 我已将 Nola Translator 更新到最新正式版。
          required: true
        - label: 我已将显卡驱动更新到设备可用的最新版本。
          required: true
        - label: 我已将相关日志提交给 AI 助手并尝试其建议，但问题仍未解决。
          required: true
  - type: checkboxes
    id: inference-troubleshooting
    attributes:
      label: 推理框架排查（如适用）
      description: 如果问题涉及本地推理框架或模型加载器，请确认已尝试以下排查。
      options:
        - label: 我已在 llama.cpp 和 CrispASR 加载器之间切换，并尝试对应的模型文件，但问题仍然存在。
          required: false
  - type: input
    id: version
    attributes:
      label: Nola Translator 版本
      description: "可在设置或关于页面查看版本号。"
      placeholder: "例如：1.1.0"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: 操作系统
      options:
        - Windows
        - macOS
        - Linux
        - 其他
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: 显卡 / 图形适配器型号
      description: 请尽量填写厂商和完整型号；如果不清楚，请填写“不清楚”。
      placeholder: "例如：NVIDIA GeForce RTX 4060、Intel Iris Xe，或不清楚"
    validations:
      required: true
  - type: input
    id: gpu-driver
    attributes:
      label: 显卡驱动版本
      description: 请填写当前安装的驱动版本；如果不清楚，请填写“不清楚”。
      placeholder: "例如：566.36 或不清楚"
    validations:
      required: true
  - type: input
    id: cpu
    attributes:
      label: CPU 型号（选填）
      placeholder: "例如：Intel Core i7-12700H"
    validations:
      required: false
  - type: input
    id: memory
    attributes:
      label: 系统内存 / RAM（选填）
      placeholder: "例如：16 GB"
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: 问题涉及的功能
      options:
        - 实时字幕 / 语音识别
        - 翻译 / 模型
        - 工作台
        - 浏览器扩展
        - 安装 / 更新
        - 设置 / 其他
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请按顺序写出操作步骤；如果问题不稳定，请说明出现频率。
      placeholder: |
        1. 打开……
        2. 选择……
        3. 观察到……
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 描述发生了什么；如有报错，请附上完整错误信息。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
      description: 描述你原本预期发生什么。
    validations:
      required: true
  - type: textarea
    id: attachments
    attributes:
      label: 截图、日志或补充信息
      description: 可拖入截图或日志文件。分享前请删除 API 密钥、个人信息和其他敏感内容。
    validations:
      required: false
