name: Build Windows application
description: Build the Electron installer with private CPU Python and llama.cpp runtimes
outputs:
  exe-x64:
    description: Windows x64 EXE installer
    value: ${{ steps.package.outputs.exe-x64 }}
  msi-x64:
    description: Windows x64 MSI installer
    value: ${{ steps.package.outputs.msi-x64 }}
  source:
    description: Source ZIP
    value: ${{ steps.package.outputs.source }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v6
      with:
        node-version: '24'
        cache: npm
    - uses: actions/setup-python@v6
      with:
        python-version: '3.13'
        architecture: x64
        cache: pip
        cache-dependency-path: engine/pyproject.toml
    - name: Cache Python downloads and llama archive
      uses: actions/cache@v5
      with:
        path: vendor/llama-zips
        key: windows-llama-cpu-${{ hashFiles('scripts/fetch-llama-cpu.ps1') }}
    - name: Install Node dependencies
      shell: pwsh
      run: |
        npm ci
        if ($LASTEXITCODE -ne 0) { throw 'npm ci failed' }
    - name: Build installer
      id: package
      shell: pwsh
      env:
        CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      run: ./scripts/ci-build-windows.ps1
