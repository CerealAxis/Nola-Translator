[project]
name = "fluentcaptions-engine"
version = "0.1.0"
description = "FluentCaptions 本地音频、识别与翻译引擎"
requires-python = ">=3.13,<3.14"
dependencies = [
  "argostranslate==1.11.0",
  "faster-whisper==1.2.1",
  "numpy==2.5.1",
  "pydantic==2.13.4",
  "PyAudioWPatch==0.2.12.8",
  "scipy==1.18.0",
  "sherpa-onnx==1.13.4"
]

[project.optional-dependencies]
dev = [
  "pyinstaller==6.21.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0"
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
