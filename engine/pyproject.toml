[project]
name = "fluentcaptions-engine"
version = "0.1.0"
description = "FluentCaptions 本地音频、识别与翻译引擎"
requires-python = ">=3.13,<3.14"
dependencies = [
  "pydantic==2.13.4"
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0"
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
